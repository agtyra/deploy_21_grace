<style>

                padding: 12px 16px;

</div>

<!--Main Content Canvas-->
 <div class="flex-1 overflow-y-auto mt-16 p-md md:p-lg lg:p-xl canvas-scroll bg-surface">
        <div class="max-w-[1400px] mx-auto w-full">
                
                <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-lg">
                        <div>
                                <h2 class="font-h1 text-h1 text-on-surface mb-xs">Course Comparison</h2>
                                <div class="flex items-center gap-md text-on-surface-variant font-body-sm text-body-sm">
                                <span class="flex items-center gap-1">
                                </span>       
                        </div>
                </div>
        <div class="flex items-center gap-sm" id="dropdown">
          <button onclick="dropdown()" class="inline-flex items-center justify-center gap-2 px-4 py-2 bg-surface-container-lowest text-on-surface border border-outline-variant rounded-lg font-label-md text-label-md hover:bg-surface-container-low transition-colors shadow-sm active:scale-95" id="dropbtn">
            <span class="material-symbols-outlined text-[18px]">add</span>
            Add Course
          </button>
          <div id="mydropdown" class="dropdown-content">
                <button onclick="addcourse(CSSE1001)">CSSE1001</button>
                <button onclick="addcourse(MATH1051)">MATH1051</button>
                <button onclick="addcourse(COMP3506)">COMP3506</button>
          </div>
        </div>
        </div>
        <div class="flex items-center justify-around p-md pb-sm border-b border-surface-container-highest">
        <div class="flex items-center justify-between p-md pb-sm border-surface-container-highest">
              <div>
                <h3 class="font-h3 text-h3 text-on-surface" id="course1">Course 1</h3>
                </div>
        </div>
        <div class="flex items-center justify-between p-md pb-sm border-surface-container-highest">
              <div>
                <h3 class="font-h3 text-h3 text-on-surface" id="course2">Course 2</h3>
                </div>
        </div>
        </div>
        <div class="flex items center justify p-md pb-sm border surface container-highest">
        <div class="empty-placeholder" id="course1">Sample Text</div>
        <div class="empty-placeholder">Sample Text</div>
        </div>
        </div>

</div>
<script>
        function dropdown() {
                document.getElementById('mydropdown').classList.toggle("show");
        }
        window.onclick = function(event) {
                if (!event.target.matches('#dropbtn')) {
                        var dropdowns = document.getElementsByClassName("dropdown-content");
                        var i;
                        for (i = 0; i < dropdowns.length; i++) {
                                var openDropdown = dropdowns[i];
                                if (openDropdown.classList.contains('show')) {
                                        openDropdown.classList.remove('show');
                                }
                        }
                }
        }

        function addcourse(course_code) {

                var xhttp = new XMLHttpRequest();
                xhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                // Typical action to be performed when the document is ready:
                document.getElementById("course1").innerHTML = xhttp.responseText;
                }
                };
                xhttp.open("GET", "course/<str:course_code>/", true);
                xhttp.send();

        }
</script>
